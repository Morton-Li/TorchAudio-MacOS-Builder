name: Build TorchAudio

on:
  workflow_dispatch:

env:
  BUILD_VERSION: "2.11.1"
  TORCH_VERSION: "2.15.0"

jobs:
  build:
    runs-on: macos-15-intel
    env:
      PYTHON_VERSION: '3.12'
    name: Build TorchAudio wheel
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Restore TorchAudio source from cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: audio
          key: audio-v${{ env.BUILD_VERSION }}

      - name: Clone TorchAudio repo
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "v${{ env.BUILD_VERSION }}" --recursive https://github.com/pytorch/audio.git audio
          git -C audio submodule update --init --recursive --depth 1 || git -C audio submodule update --init --recursive --depth 10 || git -C audio submodule update --init --recursive

      - name: Save TorchAudio source to cache
        id: cache-save
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: audio
          key: audio-v${{ env.BUILD_VERSION }}

      - name: Build wheel
        env:
          ARCHFLAGS: "-arch x86_64"  # Override universal2 flags from the Python installer.
          CMAKE_OSX_ARCHITECTURES: "x86_64"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          USE_CUDA: "OFF"
          USE_ROCM: "OFF"
          USE_OPENMP: "ON"
          BUILD_SOX: "ON"
          BUILD_RIR: "ON"
          BUILD_RNNT: "ON"
          BUILD_ALIGN: "ON"
          USE_FFMPEG: "ON"
          CC: "/Applications/Xcode_16.4.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
          CXX: "/Applications/Xcode_16.4.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++"
        run: |
          set -e
          sudo xcode-select --switch /Applications/Xcode_16.4.app

          export MAX_JOBS=$(sysctl -n hw.logicalcpu)
          if [ "$MAX_JOBS" -gt 4 ]; then
              export MAX_JOBS=4
          fi

          export _PYTHON_HOST_PLATFORM="macosx-$MACOSX_DEPLOYMENT_TARGET-$CMAKE_OSX_ARCHITECTURES"
          export SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          export LDSHARED="clang -bundle -undefined dynamic_lookup -isysroot $SDKROOT -arch $CMAKE_OSX_ARCHITECTURES"

          mkdir -p wheels

          PY_SHORT=$(echo "${{ env.PYTHON_VERSION }}" | sed 's/\.//')
          DEPLOYMENT_TARGET=$(echo $MACOSX_DEPLOYMENT_TARGET | sed 's/\./_/g')

          wget https://github.com/Morton-Li/PyTorch-MacOS-Builder/releases/download/v${TORCH_VERSION}/torch-${TORCH_VERSION}-cp${PY_SHORT}-cp${PY_SHORT}-macosx_${DEPLOYMENT_TARGET}_${CMAKE_OSX_ARCHITECTURES}.whl

          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install torch-${TORCH_VERSION}-cp${PY_SHORT}-cp${PY_SHORT}-macosx_${DEPLOYMENT_TARGET}_${CMAKE_OSX_ARCHITECTURES}.whl
          pip install --force-reinstall cmake==3.31.6 numpy
          pip install mkl-static==2023.2.2 mkl-include==2023.2.2

          export CMAKE_PREFIX_PATH="$(realpath venv/lib)"
          export CMAKE_INCLUDE_PATH="$(realpath venv/include)"

          wget -O "$($CC -print-resource-dir)/include/omp.h" https://github.com/intel/llvm/raw/refs/heads/sycl/openmp/runtime/src/include/omp.h.var

          cd audio
          git clean -xfd

          export CMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"

          python setup.py bdist_wheel

          EXPECTED_WHEEL="torchaudio-${BUILD_VERSION}-py3-none-macosx_${DEPLOYMENT_TARGET}_${CMAKE_OSX_ARCHITECTURES}.whl"
          cp "dist/${EXPECTED_WHEEL}" ../wheels/
          cd ..

          if [ "$(ls wheels/*.whl 2>/dev/null | wc -l)" -eq 0 ]; then
            echo "No wheel built. Tag will not be created."
            exit 1
          fi

      - name: Verify wheel architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("wheels").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              libraries = [name for name in wheel.namelist() if name.endswith((".so", ".dylib"))]
              assert libraries, "No native libraries in wheel"
              for name in libraries:
                  # MH_MAGIC_64 followed by CPU_TYPE_X86_64, both little-endian.
                  header = wheel.read(name)[:8]
                  assert header.hex() == "cffaedfe07000001", (name, header.hex())
                  print(f"Verified x86_64 Mach-O: {name}")
          PY

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-${{ env.BUILD_VERSION }}-macosx-wheel
          path: wheels/*.whl

  test:
    needs: [build]
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        python_version: [ '3.11', '3.12', '3.13', '3.14' ]
    name: Test TorchAudio for Python ${{ matrix.python_version }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          architecture: x64

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: audio-${{ env.BUILD_VERSION }}-macosx-wheel
          path: wheels

      - name: Test TorchAudio wheel
        env:
          CMAKE_OSX_ARCHITECTURES: "x86_64"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -e
          PY_SHORT=$(echo "${{ matrix.python_version }}" | sed 's/\.//')
          DEPLOYMENT_TARGET=$(echo $MACOSX_DEPLOYMENT_TARGET | sed 's/\./_/g')

          wget https://github.com/Morton-Li/PyTorch-MacOS-Builder/releases/download/v${TORCH_VERSION}/torch-${TORCH_VERSION}-cp${PY_SHORT}-cp${PY_SHORT}-macosx_${DEPLOYMENT_TARGET}_${CMAKE_OSX_ARCHITECTURES}.whl

          python -m venv test-venv
          source test-venv/bin/activate
          pip install --upgrade pip setuptools numpy
          pip install torch-${TORCH_VERSION}-cp${PY_SHORT}-cp${PY_SHORT}-macosx_${DEPLOYMENT_TARGET}_${CMAKE_OSX_ARCHITECTURES}.whl
          pip install wheels/*.whl
          pip check
          python - <<'PY'
          import os
          import platform
          import torch
          import torchaudio
          from torchaudio import functional as F

          assert platform.machine() == "x86_64", platform.machine()
          assert torch.__version__.split("+", 1)[0] == os.environ["TORCH_VERSION"]
          assert torchaudio.__version__.split("+", 1)[0] == os.environ["BUILD_VERSION"]

          waveform = torch.tensor([[0.2, -0.4, 0.6, -0.8]])
          coefficients = torch.tensor([1.0, 0.0])
          torch.testing.assert_close(F.lfilter(waveform, coefficients, coefficients, clamp=False), waveform)

          log_probs = torch.tensor([
              [[4.0, 0.0, 0.0], [0.0, 4.0, 0.0],
               [4.0, 0.0, 0.0], [0.0, 0.0, 4.0]]
          ]).log_softmax(-1)
          alignment, scores = F.forced_align(log_probs, torch.tensor([[1, 2]], dtype=torch.int64), blank=0)
          torch.testing.assert_close(alignment, torch.tensor([[0, 1, 0, 2]]))
          assert torch.isfinite(scores).all()

          torch.manual_seed(0)
          logits = torch.randn(1, 3, 3, 4, requires_grad=True)
          loss = F.rnnt_loss(logits, torch.tensor([[1, 2]], dtype=torch.int32),
                             torch.tensor([3], dtype=torch.int32), torch.tensor([2], dtype=torch.int32), blank=3)
          assert torch.isfinite(loss).all()
          loss.backward()
          assert logits.grad is not None and torch.isfinite(logits.grad).all()
          print(f"TorchAudio {torchaudio.__version__} / PyTorch {torch.__version__}: native CPU operators OK")
          PY

  release:
    needs: [ build, test ]
    if: (needs.build.result == 'success') && (needs.test.result == 'success') && (startsWith(github.ref, 'refs/heads/main'))
    runs-on: macos-15-intel
    name: Create release and upload wheels
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          path: wheels
          name: audio-${{ env.BUILD_VERSION }}-macosx-wheel

      - name: Create release and upload wheels
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_VERSION }}
          name: "TorchAudio ${{ env.BUILD_VERSION }} Release"
          files: wheels/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
